---
apiVersion: k3d.io/v1alpha5
kind: Simple
metadata:
  name: dev
servers: 1
agents: 2
kubeAPI:
  hostIP: "$KUBE_API_IP"
  hostPort: "$KUBE_API_PORT"
image: rancher/k3s:v1.33.4-k3s1-amd64
subnet: $CLUSTER_SUBNET
options:
  k3d:
    wait: true
    timeout: "60s"
    disableLoadbalancer: true
  k3s:
    extraArgs:
      - arg: --flannel-backend=none
        nodeFilters:
          - server:*
      - arg: --disable-network-policy
        nodeFilters:
          - server:*
      - arg: --disable-kube-proxy
        nodeFilters:
          - server:*
      - arg: --cluster-cidr=$NODES_SUBNET
        nodeFilters:
          - server:*
      - arg: --service-cidr=$NODES_SUBNET
        nodeFilters:
          - server:*
      - arg: --disable=traefik
        nodeFilters:
          - server:*
      - arg: --disable=servicelb
        nodeFilters:
          - server:*
  kubeconfig:
    switchCurrentContext: true
