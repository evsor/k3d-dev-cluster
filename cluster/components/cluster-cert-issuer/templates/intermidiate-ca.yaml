apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: intermidiate-ca
  namespace: cert-manager
spec:
  isCA: true
  commonName: intermidiate-ca
  secretName: intermidiate-ca-secret
  duration: 43800h # 5y
  renewBefore: 35040h # 4y
  privateKey:
    algorithm: ECDSA
    size: 256
  issuerRef:
    name: root-ca-issuer
    kind: ClusterIssuer
    group: cert-manager.io
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: intermidiate-ca-issuer
spec:
  ca:
    secretName: intermidiate-ca-secret