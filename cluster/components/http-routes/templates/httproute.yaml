apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: keycloack-http-route
spec:
  parentRefs:
  - name: shared-gateway
    namespace: default
    sectionName: keycloack-https
  hostnames:
  - keycloack.local
  rules:
  - backendRefs:
    - name: keycloack-keycloak
      port: 80