apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: '-90'
  name: cert-manager
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'oci://quay.io/jetstack/charts/cert-manager'
    targetRevision: v1.19.1
    path: .
    helm:
      valuesObject:
        crds:
          enabled: true
  destination:
    server: https://kubernetes.default.svc
    namespace: cert-manager
  syncPolicy:
    automated:
      prune: true
      selfHeal: true