apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: '-60'
  name: keycloack
  namespace: argocd
spec:
  project: default
  sources:
  - repoURL: 'oci://registry-1.docker.io/bitnamicharts/keycloak'
    targetRevision: 25.2.0
  destination:
    server: https://kubernetes.default.svc
    namespace: keycloack
  syncPolicy:
    syncOptions:
    - CreateNamespace=true
    automated:
      prune: true
      selfHeal: true